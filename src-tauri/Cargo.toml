[package]
name = "kobito-bar"
version = "0.1.0"
description = "KobitoKey companion tray app — 左右の電池残量とキーマップを教えてくれる小人"
authors = ["e-sp9"]
edition = "2021"
license = "MIT"
repository = "https://github.com/e-sp9/kobito-bar"

[lib]
name = "kobito_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# btleplug(マイルストーン2)は mac/win 限定のターゲット依存として追加する予定:
# [target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
