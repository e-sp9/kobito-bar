[package]
name = "kobito-bar"
version = "0.1.0"
description = "KobitoKey companion tray app — 左右の電池残量とキーマップを教えてくれる小人"
authors = ["e-sp9"]
edition = "2021"
license = "MIT"
repository = "https://github.com/e-sp9/kobito-bar"

[lib]
name = "kobito_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api は透明ウィンドウ(トレイポップアップの角丸)に必要。
# App Store 配布は不可になるが、配布は GitHub Releases なので問題ない
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# BLE 層(マイルストーン2)。btleplug ではなく bluest を採用:
# 接続済みデバイス列挙(connected_devices_with_services)・CUD descriptor 読み取り・
# 切断イベント検出をクロスプラットフォームで提供し、OS API 直叩きが不要になる
# (参考実装 zmk-battery-center と同じ構成)。Linux backend(BlueZ)もあるため
# 無条件依存にでき、WSL2 でも cargo check が通る
bluest = "0.6"
futures-util = "0.3"
uuid = "1"
tokio = { version = "1", features = ["time", "macros"] }

# キーマップ画像の取得(マイルストーン4)。GitHub raw からダウンロードして
# キャッシュする。rustls-tls: cargo-xwin クロスビルドで OpenSSL を避けるため
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
prost = "0.14.4"
